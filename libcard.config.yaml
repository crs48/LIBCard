# --- Status chip wording (optional) ---
# Rephrase any `status:` chip without touching the code. Every key is optional;
# anything you leave out keeps its default text (Ready, In progress, Experiment,
# Exploration, Writing, Reading, Dormant).
# statuses:
#   wip: Building
#   exploration: Investigating

# --- Rich content blocks (optional, ordered) ---
# An ordered list of typed blocks rendered between your links and the social row.
# Every block is validated data — never raw HTML — so it stays safe and simple.
# Four tiers, all with ZERO of our JavaScript: (1) static HTML/CSS, (2) third-
# party form POST, (3) live provider iframes (privacy-safe defaults), and
# (4) build-time embeds (baked to static HTML, refreshed on rebuild).
blocks:
  - type: tweet # baked to static HTML at build time (no runtime JS)
    url: https://x.com/becomingbabyman/status/1566619477508333568
  - type: divider
    label: Like this site?
  - type: heading
    text: Thanks! Want to build your own?
  - type: text
    markdown: >
      I made LIBCard as a free, fast, **zero-JavaScript** link-in-bio page and virtual business
      card you host yourself on GitHub Pages. Edit one file, save, done.
      Grab the code at [github.com/crs48/LIBCard](https://github.com/crs48/LIBCard).
  - type: faq
    items:
      - q: Is it really free?
        a: Yes — it runs on GitHub Pages with no server and no subscription.
      - q: Can I use my own domain?
        a: Yes. Add a CNAME and set site.base to "/".
      - q: Can I embed content?
        a: Yup. Video, maps, music, forms, and more.
  - type: divider
    label: Like how I operate?
  - type: heading
    text: >-
      Yay! Support my work, try a project, share feedback, or contribute to
      whatever energizes you.
  - type: text
    markdown: >
      Help keep these experiments going at [crs.tips](https://crs.tips), my own
      instance of [Feedme](https://feedme.fund/) — the open-source tipping tool
      I'm building. It reads the project list directly from this site's LibCard
      config, so you can tip me and pick the experiments you'd like to see more of.
  - type: tip-buttons
    feedme: true # primary button → my Feedme checkout ("Tip at crs.tips")
    # feedmeLabel: Tip at crs.tips   # the default; override the button text here
    feedmeNote: >-
      Your pick is a suggestion about where to put my energy. Every tip supports
      me either way.
    venmo: christophersmothers
    paypal: chrissmothers
    wise: chriss907
  - type: divider
    label: What's your dream internet?
  - type: heading
    text: Shall we prototype it together?
  - type: text
    markdown: |-
      xNet is my prototype of the internet tools I wish existed. I'm building a way to make local-first apps that feel like personal software: yours to tinker with, pull apart, and fit together like Lego.

      Your data lives on your device. The apps work offline, you choose what to share, and you can change tools without leaving your stuff behind. I want to see what people make when software can grow around their lives and the little communities they care about.

      [Come explore xNet](https://xnet.fyi/), [read the stories behind it](https://xnet.fyi/blog/), or [tinker with the code](https://github.com/crs48/xNet).
  - type: divider
    label: Contact me
  - type: contact-buttons
    call: true # uses contact.phone above; or set a number string
    whatsapp: becomingbabyman # username → wa.me/becomingbabyman
    telegram: becomingbabyman
    email: true # uses contact.email above
