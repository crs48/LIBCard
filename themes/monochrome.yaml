# yaml-language-server: $schema=./theme.schema.json
name: Monochrome
author: "@crs48"
authorUrl: https://github.com/crs48
license: MIT
official: true
mode: light
tags: [light, dark, minimal, editorial]
description: Black ink or soft white on charcoal, quiet rules, and a serif introduction.
tokens:
  bg: "#ffffff"
  surface: "#f5f5f5"
  fg: "#191919"
  muted: "#686868"
  accent: "#191919"
  accentContrast: "#ffffff"
  border: "#dedede"
  font: sans
  displayFont: serif
  radius: 0.5rem
schemes:
  dark:
    tokens:
      bg: "#171717"
      surface: "#222222"
      fg: "#eeeeee"
      muted: "#aaaaaa"
      accent: "#eeeeee"
      accentContrast: "#171717"
      border: "#393939"
